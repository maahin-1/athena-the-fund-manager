[package]
name = "athena-terminal"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Athena terminal: local server that holds the live price feed and pushes it to a docked page"

[dependencies]
hmac = "0.12"
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs"] }
duckdb = { version = "~1.20000.2", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
# a paused, controlled clock for the bounded-queue tests (T6): the same crate, one more feature, no new package
tokio = { version = "1", features = ["full", "test-util"] }
# an in-process client for the router, so the request-size tests do not depend on a socket: the crate axum already uses, with the feature it already enables (no new package)
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 4
