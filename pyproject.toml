[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "athena"
version = "0.1.0"
description = "Agentic multi-asset fund manager"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.5.6,<1.6", "requests>=2.31", "jugaad-data>=0.35", "yfinance>=1.0", "numpy>=1.26", "TA-Lib>=0.6", "plotly>=7.1", "streamlit>=1.65", "defusedxml>=0.7", "openpyxl>=3.1", "xlrd>=2.0.1,<3", "pypdf>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
